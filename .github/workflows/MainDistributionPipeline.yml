#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # Pushes build only on main. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so every ungated job here built
  # TWICE per push: 13 duplicate jobs, 2 of them hosted macOS legs and 2
  # hosted Windows, measured on c84552cfb3 (push run 39142715202 and
  # pull_request run 39142719223, same head_sha). The pull_request run is
  # the one whose status matters. What the filter costs: a branch with no PR
  # open gets no CI until the PR opens. Nothing here deploys on tags, and
  # workflow_dispatch still runs on any branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key ON PURPOSE. Without it a push to a
  # branch and a workflow_dispatch on that same branch collide: same ref, same
  # sha, and both carry an EMPTY head_ref/base_ref, so every other term in this
  # key is identical. cancel-in-progress then kills the push run the moment the
  # canary is dispatched by hand -- and a cancelled run reads as a FAILED check
  # on the PR dashboard, indistinguishable from a real build break.
  #
  # This is what produced the five red checks on PR #7 (run 33837528273: Generate
  # matrix, Linux, MacOS, Windows and DuckDB-Wasm all `cancelled`) while the same
  # commit built green under both pull_request and workflow_dispatch. Nothing was
  # wrong with the code; the workflow was cancelling itself.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # RESOLVE main TO A (commit, version) PAIR. `duckdb_version: main` reached the
  # build as DUCKDB_VERSION=main, and duckdb main's CMakeLists.txt reads that env var
  # as its explicit version (line 487 at a494af27aa takes DUCKDB_EXPLICIT_VERSION from
  # ENV{DUCKDB_VERSION}; line 497 takes GIT_COMMIT_HASH from ENV{DUCKDB_COMMIT}, which
  # is why the commit half of the pair is load-bearing too). The library then reports
  # 'vmain' while the extension is stamped 'main', the loader refuses it, and every
  # test SKIPS at its require line while the leg reports success.
  #
  # The version is computed the way duckdb's own CMake does for a dev build:
  # v<scripts/ci/release_version.txt>.0-dev<git rev-list --count HEAD>. Staging has no
  # prebuilt for a main commit, so ci-tools builds from source; ci_phase.py's staged
  # lookup is keyed on the COMMIT, 404s, and its caller falls back.
  #
  # `--filter=tree:0` is deliberate and is NOT `blob:none`: `rev-list --count` needs
  # the whole commit history, only its trees are skippable.
  #
  # Canonical text: duckdb_scalarfs at 6271b22, proven there on four platforms.
  duckdb-main-ref:
    name: Canary build — resolve DuckDB main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          # Commits only: rev-list --count needs the whole history, not its trees.
          git clone --quiet --filter=tree:0 --no-checkout --single-branch --branch main \
              https://github.com/duckdb/duckdb.git "$tmp/duckdb"
          commit=$(git -C "$tmp/duckdb" rev-parse HEAD)
          release=$(git -C "$tmp/duckdb" show HEAD:scripts/ci/release_version.txt | tr -d '[:space:]')
          count=$(git -C "$tmp/duckdb" rev-list --count HEAD)
          version="v${release}.0-dev${count}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.0-dev[0-9]+$ ]]; then
            echo "::error::could not build a dev version for duckdb main at $commit (got '$version')"
            exit 1
          fi
          echo "duckdb main -> $commit, version $version"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Forward-compat matrix leg: intentionally builds against duckdb `main`.
  # Expected to go red on upstream API drift; informational, NOT a merge
  # blocker. Do not FREEZE this leg at a fixed version -- merge-readiness is
  # judged on the stable v1.5-variegata build below. duckdb-main-ref does not
  # freeze it: it re-resolves main's tip on every run, and pins the resulting
  # (commit, version) pair only WITHIN that run, because the two halves must
  # agree or the loader refuses the extension.
  duckdb-next-build:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: duckdb-main-ref
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: ${{ needs.duckdb-main-ref.outputs.version }}
      duckdb_commit: ${{ needs.duckdb-main-ref.outputs.commit }}
      ci_tools_version: main
      extension_name: func_apply

      # THE GUARD. Fixing the version is only half of it: without `--require func_apply`
      # a load failure stays a silent skip that reports success, which is how
      # `0 passed, N skipped` survived here. With the guard the same condition
      # reads `require func_apply: FAILED`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require func_apply\" \"test/*\""}}'

  # Real v2.0 leg (distinct from the advisory main canary above). This builds the
  # line the community registry ships as the prerelease (build_next.yml =
  # v2.0-cyanoptera). Its `if:` (below) is byte-identical to the advisory main
  # canary's: workflow_dispatch, or push to main. It does NOT include pull_request,
  # so like the canary it does NOT gate PRs -- it only runs on manual dispatch or a
  # push to main, and is advisory, same as the canary above. (Commit fb00280
  # deliberately dropped pull_request from this leg's `if:` and left this comment
  # claiming otherwise -- two separate reviews treated the stale comment as ground
  # truth and concluded this leg gated PRs when it never ran on them.)
  #
  # It exists because this repo's varargs shim was broken on cyanoptera for a release
  # and CI could not see it: the shim's "modern" branch called SetVarArgs, which
  # v1.5.6 AND duckdb main both have and cyanoptera does not, while the only v2.0-ish
  # leg here built `main`. A hardcoded modern branch is only as trustworthy as the line
  # your canary builds, so the line has to be built. This is the leg that makes the
  # #if SITTING-style cyanoptera branch compile and TEST in-flight rather than only at
  # descriptor-repoint time in the registry.
  #
  # One arch on purpose: "does this build and test on the v2.0 line" is
  # arch-independent, and each extra arch is another from-source build, so the rest are
  # excluded to keep the loop fast.
  duckdb-cyanoptera-build:
    name: Build extension binaries (duckdb next, v2.0 line)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      # The PINNED STAGED PAIR, not the branch name. `v2.0-cyanoptera` fails
      # ci_phase.py's STAGED_DUCKDB_VERSION_PATTERN, so ci-tools resolved the
      # branch's staged version and used it ONLY to build the download URL,
      # never writing it back: the library then reported the staged version
      # while CMake stamped the extension `v2.0-cyanoptera`, and every require
      # failed. Measured on duckdb_markdown job 121336086218 (prebuilt
      # bb5bdadda4/v2.0.1-alpha50125 -> 54 files `require markdown: FAILED`)
      # against job 122478167754 (404, built from source -> 60 passed). This
      # leg's green runs were the second case: unvisited by staging, not
      # correct. `v2.0.1-alpha50125` MATCHES that pattern, so the substitution
      # never runs and the URL carries this exact version -- the one staging
      # serves for this commit.
      duckdb_version: v2.0.1-alpha50125
      duckdb_commit: bb5bdadda4ee51d39b359fe8f4d1960973191175
      ci_tools_version: main
      extension_name: func_apply
      # osx_arm64 INCLUDED + reduced_ci_mode:'disabled' (property 5): a v2.0 x macOS
      # behavioural bug (duck_hunt's missing-file handling) shipped undetected because
      # its cyanoptera leg was Linux-only. reduced_ci_mode's 'auto' default also silently
      # drops non-Linux arches on pull_request regardless of exclude_archs, so 'disabled'
      # is required for the osx leg to run on PRs -- the event this gate is meant to cover.
      # linux_amd64 + osx_arm64 only: a cheap build-AND-test v2.0 smoke, not a full matrix.
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      reduced_ci_mode: 'disabled'
      vcpkg_binary_sources: 'clear'

      # Make a skipped test run FAIL on this leg. `T` is the test pattern ci-tools
      # hands run_tests.py (`T ?=` in duckdb_extension.Makefile, so an env var wins)
      # and test_env_variables reaches `make test_release` via ci_phase.py.
      # `--require func_apply` turns "could not load" into `require func_apply: FAILED`
      # instead of a silent skip. Verified on ci-tools main against b15358c371d:
      # present -> exit 0 "16 passed, 2 skipped"; hidden -> exit 2 "0 passed, 18 failed".
      # Needs a ci_tools_version that HAS `T` (main / v2.0-cyanoptera); on
      # v1.5-variegata the variable is silently ignored -- hence `make test-require`.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require func_apply\" \"test/*\""}}'
  # Drift guard: make the "no v2.0 leg" gap unrepresentable rather than merely fixed.
  # If someone deletes the cyanoptera leg or edits the version constants, this fails
  # loudly instead of silently restoring the blind spot above. Scoped to THIS workflow
  # file only -- ExtensionTemplate.yml uses a bracketed
  # `duckdb_version: [ '<submodule_version>' ]` style an anchored grep would not match,
  # which would make the guard fail for the wrong reason.
  version-drift-guard:
    name: DuckDB version drift guard
    runs-on: ubuntu-latest
    env:
      DUCKDB_VERSION: v2.0.0
      DUCKDB_NEXT: v2.0.1-alpha50125
      DUCKDB_VARIANT: v1.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Assert both the stable and v2.0 lines are built
        run: |
          wf=.github/workflows/MainDistributionPipeline.yml
          n=$(grep -c "duckdb_version: ${DUCKDB_VERSION}$" "$wf" || true)
          m=$(grep -c "duckdb_version: ${DUCKDB_NEXT}$" "$wf" || true)
          [ "$n" -ge 1 ] || { echo "::error::no job builds the stable line duckdb_version: ${DUCKDB_VERSION}"; exit 1; }
          v=$(grep -c "duckdb_version: ${DUCKDB_VARIANT}$" "$wf" || true)
          [ "$m" -ge 1 ] || { echo "::error::no job builds the v2.0 next line duckdb_version: ${DUCKDB_NEXT}"; exit 1; }
          [ "$v" -ge 1 ] || { echo "::error::no job builds the variant line duckdb_version: ${DUCKDB_VARIANT}"; exit 1; }
          echo "drift guard OK: shipping=${DUCKDB_VERSION} (${n} job(s)), next=${DUCKDB_NEXT} (${m} job(s)), variant=${DUCKDB_VARIANT} (${v} job(s))"

  # Shipping build: targets the released, loadable v2.0.0 TAG, pinned by an
  # explicit hex commit rather than by a branch name. Hex is load-bearing --
  # DuckDB's CMakeLists requires a hex GIT_COMMIT_HASH and errors with
  # `Invalid DuckDB commit 'v2.0-cyanoptera'` -- and the version half must match
  # ci_phase.py's STAGED_DUCKDB_VERSION_PATTERN so no staged version is ever
  # substituted behind it. `v2.0.0` does. Merge-readiness is judged here.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: func_apply

      # The guard belongs here now that this leg is the gate. ci_tools
      # v2.0-cyanoptera HAS `T`; v1.5-variegata does not, which is why the
      # variant leg below deliberately carries no test_config.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require func_apply\" \"test/*\""}}'

  # The OLD shipping line, kept as a variant so the promote drops no v1.5
  # coverage. NO test_config here on purpose: `T ?=` is absent from
  # duckdb_extension.Makefile on v1.5-variegata, so test_env_variables is
  # silently ignored and a guard written here would look active while doing
  # nothing.
  duckdb-variegata-build:
    name: Build extension binaries (DuckDB v1.5 variant)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: func_apply

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: func_apply
      # Tidy now runs against the v2.0 headers, where SetCardinality and
      # GetEntry are deprecated. If it turns red here it has found something
      # real, so it is not a reason to pin this check back to v1.5.
      format_checks: 'format;tidy'
